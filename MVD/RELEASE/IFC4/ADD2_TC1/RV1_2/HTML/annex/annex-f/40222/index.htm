<h4 class="std">F.5 4.0.2.2.2</h4>
<p class="std">The Technical Corrigendum to IFC4 RV1.2 includes fixes and improvements to documentation, property sets, and fundamental concepts based on implementer feedback. There is one fix of a Where Rule (IfcShapeModel), but no more changes to the schema.</p><p><a href="../../../link/40222.htm" target="_top" ><img src="../../../img/permlink.png" style="border: 0px" title="Link to this page" alt="Link to this page"/>&nbsp; Link to this page</a></p>
